name: Flutter iOS
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: flutter build web --release
  ios:
    timeout-minutes: 35
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/market-atlas-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: market-atlas-ios-unsigned
          path: mobile/build/ios/market-atlas-ios-unsigned.zip
          retention-days: 14
      - name: Boot iPhone simulator
        run: |
          ATLAS_SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$ATLAS_SIMULATOR_ID"
          xcrun simctl bootstatus "$ATLAS_SIMULATOR_ID" -b
          echo "ATLAS_SIMULATOR_ID=$ATLAS_SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Validate chart gestures on native iOS
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/chart_experience_test.dart -d "$ATLAS_SIMULATOR_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-chart-experience-screenshots
          path: mobile/build/ios-chart-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
