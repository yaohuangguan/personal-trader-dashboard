name: iOS TestFlight release
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the signed IPA to App Store Connect / TestFlight'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 40
    environment: testflight
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload }}
        run: |
          python3 - <<'PY'
          import os,sys
          required=['IOS_DISTRIBUTION_P12_BASE64','IOS_PROVISION_PROFILE_BASE64']
          if os.environ['UPLOAD_TO_TESTFLIGHT']=='true': required+=['ASC_KEY_ID','ASC_ISSUER_ID','ASC_PRIVATE_KEY']
          missing=[key for key in required if not os.environ.get(key)]
          if missing: sys.exit('Configure GitHub environment secrets: '+', '.join(missing))
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze && flutter test
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - uses: apple-actions/import-codesign-certs@v7.1.0
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      - name: Prepare App Store signing
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: python3 tool/prepare_ios_signing.py
      - name: Build signed IPA
        run: flutter build ipa --release --build-number "$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))" --export-options-plist=ios/ExportOptions.generated.plist
      - uses: actions/upload-artifact@v4
        with:
          name: market-atlas-testflight-ipa
          path: mobile/build/ios/ipa/*.ipa
          retention-days: 7
      - name: Select IPA
        id: ipa
        run: |
          python3 - <<'PY'
          import os,pathlib
          ipa=next(pathlib.Path('build/ios/ipa').glob('*.ipa'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream: stream.write('path='+str(ipa)+'\n')
          PY
      - name: Upload to TestFlight
        if: inputs.upload
        uses: apple-actions/upload-testflight-build@v5.7.0
        with:
          app-path: mobile/${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
          wait-for-processing: 'false'
