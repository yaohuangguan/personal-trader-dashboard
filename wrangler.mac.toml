# Mac development / staging deployment (moviegoer24 Cloudflare account).
# This intentionally does NOT replace the Windows-account production Worker.
name = "personal-market-atlas-mac"
main = "src/worker/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_NAME = "Market Atlas Mac Preview"

[triggers]
crons = ["15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "market-atlas-intelligence"
database_id = "e4e570f3-0fe3-4261-a7c9-7818d4d2875d"
migrations_dir = "migrations"
