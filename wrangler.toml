name = "guanlan"
account_id = "cdc04de9bc4c6a41b5003758e505a0d1"
main = "src/worker/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[kv_namespaces]]
binding = "SHARES"
id = "f1156c885e0c4bf9baeb5f36d4ce0a78"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/sw.js", "/version.json"]

[vars]
APP_NAME = "观澜 · ATLAS"
PUBLIC_ORIGIN = "https://guanlan.nzs.workers.dev"
# Optional: configure SEC_USER_AGENT through wrangler secret put.
# Optional: configure TWELVE_DATA_API_KEY / ALPHA_VANTAGE_API_KEY through wrangler secret put.

[[durable_objects.bindings]]
name = "SIGNAL_MONITOR"
class_name = "SignalMonitor"

[[durable_objects.bindings]]
name = "MARKET_SCANNER"
class_name = "MarketScanner"


# Preserve existing SQLite Durable Object state while moving both classes
# from the legacy Worker to guanlan (Cloudflare transfer migration).
[[migrations]]
tag = "guanlan-transfer-20261031"

[[migrations.transferred_classes]]
from = "SignalMonitor"
from_script = "personal-market-atlas"
to = "SignalMonitor"

[[migrations.transferred_classes]]
from = "MarketScanner"
from_script = "personal-market-atlas"
to = "MarketScanner"
