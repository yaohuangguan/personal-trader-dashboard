name = "guanlan"
account_id = "cdc04de9bc4c6a41b5003758e505a0d1"
main = "src/worker/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[kv_namespaces]]
binding = "SHARES"
id = "f1156c885e0c4bf9baeb5f36d4ce0a78"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_NAME = "观澜 · ATLAS"
PUBLIC_ORIGIN = "https://guanlan.nzs.workers.dev"
# Optional: configure SEC_USER_AGENT through wrangler secret put.
# Optional: configure TWELVE_DATA_API_KEY / ALPHA_VANTAGE_API_KEY through wrangler secret put.

[[durable_objects.bindings]]
name = "SIGNAL_MONITOR"
class_name = "SignalMonitor"
script_name = "personal-market-atlas"

[[durable_objects.bindings]]
name = "MARKET_SCANNER"
class_name = "MarketScanner"
script_name = "personal-market-atlas"


[[services]]
binding = "LEGACY_STATE"
service = "personal-market-atlas"
